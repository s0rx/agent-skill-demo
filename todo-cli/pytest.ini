[pytest]
pythonpath = src
addopts = 
    -v
    --junitxml=reports/test-results/results.xml
    --html=reports/test-results/results.html
    --self-contained-html
    --cov=src
    --cov-report=term
    --cov-report=html:reports/coverage-results
    --cov-report=xml:reports/coverage-results/coverage.xml
